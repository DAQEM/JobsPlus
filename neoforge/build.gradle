//file:noinspection GroovyAssignabilityCheck
//file:noinspection GrDeprecatedAPIUsage
//file:noinspection DependencyNotationArgument
plugins {
    id "com.github.johnrengelman.shadow"
    id "me.modmuss50.mod-publish-plugin" version "2.1.1"
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:${project.neoforge_version}"
    modApi "dev.architectury:architectury-neoforge:${project.architectury_version}"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')

    modImplementation "curse.maven:yaml-config-1128669:${project.config_library_file_neoforge}"
    modImplementation "curse.maven:arc-883593:${project.arc_file_neoforge}"
    modImplementation "curse.maven:item-restrictions-887774:${project.item_restrictions_file_neoforge}"
    modImplementation "curse.maven:ui-933200:${project.ui_library_file_neoforge}"
}

processResources {
    var replaceProperties = [
            "version": project.version,
            "mod_id": project.mod_id,
            "mod_name": project.mod_name,
            "mod_description": project.mod_description,
            "mod_author": project.mod_author,
            "mod_license": project.mod_license,
            "mod_repository": project.mod_repository,

            "neoforge_loader_version": project.neoforge_loader_version,
            "neoforge_version": project.neoforge_version,
            "minecraft_version": project.minecraft_version,
            "architectury_version": project.architectury_version,
            "config_library_version": project.config_library_version,
            "arc_version": project.arc_version,
            "item_restrictions_version": project.item_restrictions_version,
            "ui_library_version": project.ui_library_version
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

shadowJar {
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "neoforge-dev-shadow"
}

remapJar {
    inputFile.set shadowJar.archiveFile
    archiveClassifier = "neoforge"
}

remapSourcesJar {
    archiveClassifier = "neoforge-sources"
}

publishMods {
    file = remapJar.archiveFile
    additionalFiles.from(remapSourcesJar.archiveFile)
    changelog = rootProject.file('changelog.md').text
    version = project.mod_version
    type = project.release_type == "release" ? STABLE : (project.release_type == "beta" ? BETA : ALPHA)
    modLoaders.add("neoforge")

    curseforge {
        accessToken = System.getenv("CURSEFORGE_API_KEY")
        projectId = project.curse_forge_project_id
        minecraftVersions.addAll(project.supported_minecraft_versions.split(','))

        displayName = "$project.mod_name NeoForge - $project.mod_version"

        client = true
        server = true

        project.curseforge_dependencies.split(',').each { dep ->
            requires(dep.trim())
        }
    }

    modrinth {
        accessToken = System.getenv("MODRINTH_API_KEY")
        projectId = project.modrinth_project_id
        minecraftVersions.addAll(project.supported_minecraft_versions.split(','))

        displayName = "$project.mod_name NeoForge - $project.mod_version"

        project.modrinth_dependencies.split(',').each { dep ->
            requires(dep.trim())
        }
    }
}