architectury {
    common(rootProject.enabled_platforms.split(","))
}

loom {
    accessWidenerPath = project(':common').file("src/main/resources/${rootProject.mod_id}.accesswidener")
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    implementation project(path: ":common", configuration: "namedElements")
    modImplementation "com.daqem.uilib:uilib-common:${project.uilib_version}"
    modImplementation "com.daqem.yamlconfig:yamlconfig-common:${project.yamlconfig_version}"
    modImplementation "com.daqem.arc:arc-common:${project.arc_version}"
    modImplementation "com.daqem.itemrestrictions:itemrestrictions-common:${project.itemrestrictions_version}"
}