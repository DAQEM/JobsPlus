architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
}

apply from: rootProject.file("gradle/scripts/platform.gradle")
apply from: rootProject.file("gradle/scripts/publishing.gradle")
apply from: rootProject.file("gradle/scripts/maven-publishing.gradle")

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')

    modImplementation "com.daqem.uilib:uilib-neoforge:${project.uilib_version}"
    modImplementation "com.daqem.yamlconfig:yamlconfig-neoforge:${project.yamlconfig_version}"
    modImplementation "com.daqem.arc:arc-neoforge:${project.arc_version}"
    modImplementation "com.daqem.itemrestrictions:itemrestrictions-neoforge:${project.itemrestrictions_version}"
}